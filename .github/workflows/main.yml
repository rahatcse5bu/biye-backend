name: 🚀 Deploy backend to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# TODO: one deploy per branch at a time; a newer push cancels the older run.
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # TODO: version comes from "packageManager" in package.json.
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4

      # TODO: keep Node in sync with package.json engines and the sanitizer bundle target.
      - name: 🟢 Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: tsc fails the job on type errors, so broken code never deploys.
      - name: 🔍 Type check
        run: pnpm run build

      - name: ▲ Install Vercel CLI
        run: npm install --global vercel@latest

      - name: ⚙️ Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy
        run: vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
